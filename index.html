<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base + Balance — coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #0a0e34;
    --navy-deep: #060821;
    --white: #f3f2ec;
    --periwinkle: #838cd4;
    --periwinkle-dim: #5c63a0;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--navy);
    color: var(--white);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 40px;
  }

  header{
    padding-top: 56px;
  }
  .brand{
    font-weight: 700;
    font-size: clamp(30px, 6vw, 44px);
    letter-spacing: -0.5px;
    line-height: 1.15;
    margin: 0;
    display: inline-block;
  }
  .brand-underline{
    width: 60px;
    height: 3px;
    background: var(--periwinkle);
    margin-top: 12px;
  }
  .tagline{
    font-size: 13px;
    color: var(--periwinkle-dim);
    margin: 14px 0 0;
  }

  main{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 40px;
  }

  .content{ width: 100%; padding-bottom: 24px; text-align: center; }

  .eyebrow{
    color: var(--periwinkle);
    font-size: clamp(20px, 4vw, 26px);
    margin: 0 0 6px;
  }

  h1{
    font-weight: 700;
    font-size: clamp(28px, 6vw, 46px);
    line-height: 1.15;
    margin: 0 0 22px;
    white-space: nowrap;
  }
  .tilt{
    display: block;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    transform-origin: 50% 50%;
    animation: tilt 4.5s ease-in-out infinite;
  }
  @keyframes tilt{
    0%, 100%{ transform: rotate(-2deg); }
    50%{ transform: rotate(2deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .tilt{ animation: none; }
  }

  .sub{
    font-size: clamp(15px, 2.6vw, 17px);
    font-weight: 400;
    color: var(--white);
    opacity: 0.75;
    margin: 0 auto 40px;
    max-width: 34ch;
    line-height: 1.6;
  }
  .sub .u{
    color: var(--periwinkle);
  }

  form{
    display: flex;
    gap: 10px;
    max-width: 380px;
    margin: 0 auto 12px;
  }
  input[type="email"]{
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--periwinkle-dim);
    color: var(--white);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 10px 2px;
    outline: none;
  }
  input[type="email"]::placeholder{ color: var(--periwinkle-dim); }
  input[type="email"]:focus{ border-bottom-color: var(--periwinkle); }
  input[type="email"]:-webkit-autofill,
  input[type="email"]:-webkit-autofill:hover,
  input[type="email"]:-webkit-autofill:focus{
    -webkit-text-fill-color: var(--white);
    -webkit-box-shadow: 0 0 0 1000px transparent inset;
    box-shadow: 0 0 0 1000px transparent inset;
    transition: background-color 9999s ease-in-out 0s;
  }

  button{
    background: var(--periwinkle);
    color: var(--navy-deep);
    border: none;
    padding: 0 20px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    border-radius: 0;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s ease;
  }
  button:hover{ opacity: 0.85; }
  button:active{ opacity: 0.7; }

  .microcopy{
    font-size: 12px;
    color: var(--periwinkle-dim);
    margin: 0 0 40px;
  }

  .confirm{
    font-size: 13px;
    color: var(--periwinkle);
    max-width: 380px;
    margin: 0 auto 44px;
    display: none;
  }
  .confirm.show{ display: block; }

  .err{
    font-size: 13px;
    color: #d98a7a;
    margin: 0 auto 44px;
    display: none;
  }
  .err.show{ display: block; }

  footer{
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--periwinkle-dim);
    padding: 20px 0 40px;
    border-top: 1px solid rgba(131,140,212,0.18);
  }

  .mark{ width: 26px; height: 20px; opacity: 0.9; }

  @media (max-width: 480px){
    .wrap{ padding: 0 24px; }
    form{ flex-direction: column; }
    button{ padding: 12px; }
    h1{ font-size: clamp(20px, 7vw, 30px); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="brand">Base +<br>Balance</p>
    <div class="brand-underline"></div>
    <p class="tagline">Build your base. Find your balance.</p>
  </header>

  <main>
    <div class="content">
      <p class="eyebrow">first up: nightly ritual</p>
      <h1 class="tilt">still finding our balance</h1>

      <p class="sub">magnesium, potassium + sodium to wind down at night. coming soon.</p>

      <form id="notify-form" novalidate>
        <input type="email" id="email" placeholder="your email" autocomplete="email">
        <button type="submit">Get early access</button>
      </form>
      <p class="microcopy" id="microcopy">one email. no spam. unsubscribe anytime.</p>
      <p class="err" id="err">enter an email first</p>
      <p class="confirm" id="confirm">you're on the list — we'll write when it's ready.</p>

      <footer>
        <span>est. 2026</span>
        <svg class="mark" viewBox="0 0 60 46" xmlns="http://www.w3.org/2000/svg">
          <rect x="6" y="4" width="48" height="6" fill="#838cd4"/>
          <path d="M4 16 H56 A26 26 0 0 1 4 16 Z" fill="#838cd4"/>
        </svg>
      </footer>
    </div>
  </main>
</div>

<script>
  const form = document.getElementById('notify-form');
  const email = document.getElementById('email');
  const err = document.getElementById('err');
  const confirm = document.getElementById('confirm');
  const microcopy = document.getElementById('microcopy');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const val = email.value.trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
    if(!valid){
      err.classList.add('show');
      confirm.classList.remove('show');
      return;
    }
    err.classList.remove('show');
    confirm.classList.add('show');
    microcopy.style.display = 'none';
    email.value = '';
    email.blur();
  });

  email.addEventListener('input', function(){
    err.classList.remove('show');
  });
</script>
</body>
</html>
