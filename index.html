<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base + Balance — coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #0a0e34;
    --navy-deep: #060821;
    --white: #f3f2ec;
    --periwinkle: #838cd4;
    --periwinkle-dim: #5c63a0;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: var(--navy);
    color: var(--white);
    font-family: 'JetBrains Mono', monospace;
    overflow-x: hidden;
    position: relative;
  }

  .page{
    max-width: 1100px;
    margin: 0 auto;
    padding: 64px 32px 60px;
    position: relative;
  }

  /* twinkling background stars */
  .star{
    position: absolute;
    color: var(--periwinkle);
    animation: twinkle ease-in-out infinite;
    pointer-events: none;
    user-select: none;
  }
  @keyframes twinkle{
    0%, 100%{ opacity: 0.25; transform: scale(0.85); }
    50%{ opacity: 1; transform: scale(1.1); }
  }
  @media (prefers-reduced-motion: reduce){
    .star{ animation: none; opacity: 0.6; }
  }

  /* header */
  header{ text-align: center; margin-bottom: clamp(60px, 10vh, 120px); position: relative; z-index: 2; }
  .logo{
    width: clamp(220px, 32vw, 340px);
    height: auto;
    display: inline-block;
  }
  .tagline{
    font-size: clamp(13px, 2.2vw, 15px);
    margin: 16px 0 0;
    color: var(--periwinkle-dim);
  }
  .tagline b{ color: var(--white); font-weight: 700; }

  /* constellation zone */
  .constellation{
    position: relative;
    min-height: 460px;
    z-index: 2;
  }
  .hero-text{
    position: absolute;
    top: 6%;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    width: 100%;
  }
  .eyebrow{
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--periwinkle-dim);
    margin: 0 0 8px;
  }
  h1{
    font-weight: 700;
    font-size: clamp(24px, 4.5vw, 34px);
    margin: 0;
  }
  .hint{
    font-size: 12px;
    color: var(--periwinkle);
    margin: 10px 0 0;
  }

  .node{ position: absolute; }
  @keyframes float{
    0%, 100%{ transform: translateY(0) scale(1); }
    50%{ transform: translateY(-10px) scale(1.35); }
  }

  .star-node{
    position: absolute;
    background: none;
    border: none;
    padding: 14px;
    margin: -14px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    z-index: 1;
  }
  .star-node:hover,
  .star-node.active{
    z-index: 6;
  }
  .star-node .star-icon{
    width: 30px;
    height: 30px;
    display: block;
    position: relative;
    animation: float 4.5s ease-in-out infinite;
    transition: transform 0.15s ease;
  }
  .star-node:hover .star-icon,
  .star-node.active .star-icon{
    transform: scale(1.2);
  }
  .node-magnesium .star-icon{ animation-delay: 0.6s; }
  .node-sodium .star-icon{ animation-delay: 1.3s; }
  @media (prefers-reduced-motion: reduce){
    .star-node .star-icon{ animation: none; }
  }

  .star-row{ display: contents; }

  .node-potassium{ top: 32%; right: 8%; }
  .node-magnesium{ top: 46%; left: 10%; }
  .node-sodium{ top: 60%; left: 50%; }

  /* circle + connector + text reveal */
  .reveal{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .star-node:hover .reveal,
  .star-node.active .reveal{
    opacity: 1;
    pointer-events: auto;
  }
  .reveal-ring{
    position: absolute;
    top: 50%;
    left: 50%;
    width: 60px;
    height: 60px;
    transform: translate(-50%, -50%);
    border: 1.5px solid var(--periwinkle-dim);
    border-radius: 50%;
  }
  .reveal-line-h{
    position: absolute;
    top: 50%;
    left: calc(50% + 30px);
    width: 64px;
    height: 1px;
    background: var(--periwinkle-dim);
  }
  .reveal-line-v{
    position: absolute;
    top: 50%;
    left: calc(50% + 94px);
    width: 1px;
    height: 46px;
    background: var(--periwinkle-dim);
  }
  .reveal-text{
    position: absolute;
    top: calc(50% + 46px);
    left: calc(50% + 106px);
    width: 150px;
    display: block;
    text-align: left;
    white-space: normal;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
  .reveal-title{
    display: block;
    font-size: 12px;
    font-weight: 700;
    color: #ffc61e;
    margin: 0 0 5px;
    white-space: nowrap;
  }
  .reveal-body{
    display: block;
    width: 100%;
    font-size: 12px;
    color: var(--periwinkle-dim);
    line-height: 1.5;
  }

  /* potassium is mirrored: text sits left of the circle with a
     simple straight connector, no vertical bend */
  .node-potassium .reveal-line-v{ display: none; }
  .node-potassium .reveal-line-h{ left: auto; right: calc(50% + 30px); }
  .node-potassium .reveal-text{
    top: calc(50% - 6px);
    left: auto;
    right: calc(50% + 104px);
    text-align: right;
  }

  /* sodium: connector drops down from the circle first, then
     runs right into the text, instead of right-then-down */
  .node-sodium .reveal-line-v{
    top: calc(50% + 30px);
    left: 50%;
    height: 46px;
  }
  .node-sodium .reveal-line-h{
    top: calc(50% + 76px);
    left: 50%;
    width: 60px;
  }
  .node-sodium .reveal-text{
    top: calc(50% + 40px);
    left: calc(50% + 74px);
  }

  /* closing statement */
  .closing{
    text-align: center;
    margin: clamp(40px, 8vh, 80px) 0 40px;
    position: relative;
    z-index: 2;
  }
  .closing-line{
    font-size: clamp(16px, 3vw, 24px);
    font-weight: 500;
    margin: 0 0 6px;
    color: var(--white);
  }
  .closing-line .accent{ color: var(--periwinkle); }

  /* form */
  .form-wrap{ display: flex; justify-content: center; position: relative; z-index: 2; }
  form{
    display: flex;
    align-items: center;
    background: rgba(131,140,212,0.06);
    border: 1.5px solid var(--periwinkle-dim);
    border-radius: 999px;
    padding: 6px 6px 6px 28px;
    width: 620px;
    max-width: 100%;
  }
  input[type="email"]{
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    color: var(--white);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
    padding: 10px 2px;
    outline: none;
  }
  input[type="email"]::placeholder{ color: var(--periwinkle-dim); }
  input[type="email"]::selection{
    background: transparent;
    color: var(--white);
  }
  input[type="email"]:-webkit-autofill,
  input[type="email"]:-webkit-autofill:hover,
  input[type="email"]:-webkit-autofill:focus{
    -webkit-text-fill-color: var(--white);
    -webkit-box-shadow: 0 0 0 1000px transparent inset;
    box-shadow: 0 0 0 1000px transparent inset;
    transition: background-color 9999s ease-in-out 0s;
  }
  input[type="email"]:autofill{
    background: transparent;
    color: var(--white);
  }
  button{
    background: var(--periwinkle);
    color: var(--navy-deep);
    border: none;
    padding: 0 24px;
    height: 46px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    white-space: nowrap;
    transition: opacity 0.15s ease;
  }
  button:hover{ opacity: 0.85; }
  button:active{ opacity: 0.7; }

  .status{ text-align: center; margin-top: 12px; position: relative; z-index: 2; }
  .err{ font-size: 12px; color: #d98a7a; display: none; }
  .err.show{ display: block; }
  .sending{ font-size: 12px; color: var(--periwinkle-dim); display: none; }
  .sending.show{ display: block; }
  .confirm{ font-size: 12px; color: var(--periwinkle); display: none; }
  .confirm.show{ display: block; }

  @media (max-width: 760px){
    .constellation{ min-height: 0; margin-bottom: 20px; }
    .hero-text{ position: static; transform: none; margin-bottom: 36px; }

    .star-row{
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15vw;
      padding: 18px 30px;
      border-radius: 999px;
      border: 1.5px solid transparent;
      width: fit-content;
      margin: 0 auto;
      transition: border-color 0.2s ease;
    }
    .star-row.expanded{ border-color: var(--periwinkle-dim); }
    .star-node{ position: relative; top: auto; left: auto; right: auto; padding: 10px; margin: 0; }

    /* individual per-star rings/connectors are replaced by the
       shared pill above and the ordered list below */
    .reveal-ring, .reveal-line-h, .reveal-line-v, .reveal-text{ display: none; }
  }

  .mobile-detail{ display: none; }
  @media (max-width: 760px){
    .mobile-detail{
      display: block;
      max-width: 320px;
      margin: 0 auto 32px;
      text-align: center;
    }
    .mobile-detail:empty{ display: none; margin: 0; }
    .detail-item{ margin-bottom: 16px; }
    .detail-item:last-child{ margin-bottom: 0; }
    .detail-title{
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #ffc61e;
      margin: 0 0 4px;
    }
    .detail-body{
      display: block;
      font-size: 13px;
      color: var(--periwinkle-dim);
      line-height: 1.5;
    }
  }

  @media (max-width: 480px){
    .page{ padding: 48px 20px 40px; }
    form{ padding: 4px 4px 4px 14px; }
    input[type="email"]{ font-size: 12px; }
    button{ padding: 0 14px; font-size: 11px; }
  }
</style>
</head>

  const mobileMQ = window.matchMedia('(max-width: 760px)');

  function renderMobileList(){
    let html = '';
    ingredientOrder.forEach(key => {
      const d = ingredientData[key];
      html += '<div class="detail-item"><span class="detail-title">' + d.title +
        '</span><span class="detail-body">' + d.body + '</span></div>';
    });
    mobileDetail.innerHTML = html;
  }

  const starNodes = document.querySelectorAll('.star-node');
  starNodes.forEach(node => {
    node.addEventListener('click', function(e){
      e.stopPropagation();
      if(mobileMQ.matches){
        const opening = !starRow.classList.contains('expanded');
        starRow.classList.toggle('expanded', opening);
        starNodes.forEach(n => n.classList.toggle('active', opening));
        if(opening){ renderMobileList(); } else { mobileDetail.innerHTML = ''; }
      } else {
        node.classList.toggle('active');
      }
    });
  });

  const form = document.getElementById('notify-form');
  const email = document.getElementById('email');
  const err = document.getElementById('err');
  const sending = document.getElementById('sending');
  const confirm = document.getElementById('confirm');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const val = email.value.trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);

    err.classList.remove('show');
    confirm.classList.remove('show');
    sending.classList.remove('show');

    if(!valid){
      err.textContent = 'enter an email first';
      err.classList.add('show');
      return;
    }

    sending.classList.add('show');

    fetch(form.action, {
      method: 'POST',
      headers: { 'Accept': 'application/json' },
      body: new FormData(form)
    })
    .then(function(res){
      sending.classList.remove('show');
      if(res.ok){
        confirm.classList.add('show');
        email.value = '';
        email.blur();
      } else {
        err.textContent = 'something went wrong — try again';
        err.classList.add('show');
      }
    })
    .catch(function(){
      sending.classList.remove('show');
      err.textContent = 'something went wrong — try again';
      err.classList.add('show');
    });
  });

  email.addEventListener('input', function(){
    err.classList.remove('show');
  });
</script>
</body>
</html>
