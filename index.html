<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base + Balance — coming soon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,600;1,9..144,700&family=Sora:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --olive: #adae7c;
    --olive-deep: #999a6b;
    --cream: #f3e3a8;
    --ink: #1f3b2c;
    --ink-soft: #33513f;
    --gold: #c6a53c;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; }
  body{
    background: linear-gradient(135deg, var(--olive-deep), var(--olive) 45%, #b8b98a 70%, var(--olive-deep));
    background-size: 300% 300%;
    animation: drift 18s ease-in-out infinite;
    color: var(--ink);
    font-family: 'Sora', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  @keyframes drift{
    0%{ background-position: 0% 50%; }
    50%{ background-position: 100% 50%; }
    100%{ background-position: 0% 50%; }
  }

  @media (prefers-reduced-motion: reduce){
    body{ animation: none; }
  }

  .wrap{
    max-width: 720px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: 0 40px;
  }

  header{
    padding-top: 56px;
    text-align: center;
  }
  .brand{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(34px, 6vw, 50px);
    color: var(--cream);
    letter-spacing: 0.2px;
    margin: 0;
  }
  .brand .u{
    text-decoration: underline;
    text-decoration-color: var(--cream);
    text-decoration-thickness: 3px;
    text-underline-offset: 4px;
  }

  main{
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 40px;
  }

  .content{ width: 100%; padding-bottom: 24px; text-align: center; }

  h1{
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 700;
    font-size: clamp(30px, 6vw, 54px);
    line-height: 1.15;
    margin: 0 0 14px;
    white-space: nowrap;
  }
  .tilt{
    display: block;
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    transform-origin: 50% 50%;
    animation: tilt 4.5s ease-in-out infinite;
  }
  @keyframes tilt{
    0%, 100%{ transform: rotate(-2deg); }
    50%{ transform: rotate(2deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .tilt{ animation: none; }
  }

  .sub{
    font-size: clamp(19px, 3.4vw, 24px);
    font-weight: 300;
    color: var(--ink-soft);
    margin: 0 auto 40px;
    max-width: 30ch;
  }
  .sub .u{
    text-decoration: underline;
    text-decoration-color: var(--cream);
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
  }

  form{
    display: flex;
    gap: 10px;
    max-width: 420px;
    margin: 0 auto 44px;
  }
  input[type="email"]{
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--ink-soft);
    color: var(--ink);
    font-family: 'Sora', sans-serif;
    font-size: 15px;
    padding: 10px 2px;
    outline: none;
  }
  input[type="email"]::placeholder{ color: var(--ink-soft); opacity: 0.75; }
  input[type="email"]:focus{ border-bottom-color: var(--ink); }
  input[type="email"]:-webkit-autofill,
  input[type="email"]:-webkit-autofill:hover,
  input[type="email"]:-webkit-autofill:focus{
    -webkit-text-fill-color: var(--ink);
    -webkit-box-shadow: 0 0 0 1000px transparent inset;
    box-shadow: 0 0 0 1000px transparent inset;
    transition: background-color 9999s ease-in-out 0s;
  }

  button{
    background: var(--ink);
    color: var(--cream);
    border: none;
    padding: 0 22px;
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    font-weight: 500;
    border-radius: 2px;
    cursor: pointer;
    white-space: nowrap;
    transition: opacity 0.15s ease;
  }
  button:hover{ opacity: 0.85; }
  button:active{ opacity: 0.7; }

  .confirm{
    font-size: 14px;
    color: var(--ink-soft);
    max-width: 420px;
    margin: -28px auto 44px;
    display: none;
  }
  .confirm.show{ display: block; }

  .err{
    font-size: 13px;
    color: #6b2b1f;
    margin: -34px auto 44px;
    display: none;
  }
  .err.show{ display: block; }

  footer{
    display: flex;
    justify-content: center;
    font-size: 13px;
    color: var(--ink-soft);
    padding-top: 16px;
    border-top: 1px solid rgba(31,59,44,0.18);
  }

  @media (max-width: 480px){
    .wrap{ padding: 0 24px; }
    form{ flex-direction: column; }
    button{ padding: 12px; }
    h1{ font-size: clamp(22px, 7vw, 30px); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="brand">Base + <span class="u">B</span>alance</p>
  </header>

  <main>
    <div class="content">
      <h1 class="tilt">still finding our balance</h1>

      <p class="sub">a nightly ritual for wind down + <span class="u">recovery</span> — coming soon.</p>

      <form id="notify-form" novalidate>
        <input type="email" id="email" placeholder="your email" autocomplete="email">
        <button type="submit">Notify me</button>
      </form>
      <p class="err" id="err">enter an email first</p>
      <p class="confirm" id="confirm">you're on the list — we'll write when it's ready.</p>

      <footer>
        <span>est. 2026</span>
      </footer>
    </div>
  </main>
</div>

<script>
  const form = document.getElementById('notify-form');
  const email = document.getElementById('email');
  const err = document.getElementById('err');
  const confirm = document.getElementById('confirm');

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const val = email.value.trim();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
    if(!valid){
      err.classList.add('show');
      confirm.classList.remove('show');
      return;
    }
    err.classList.remove('show');
    confirm.classList.add('show');
    email.value = '';
    email.blur();
  });

  email.addEventListener('input', function(){
    err.classList.remove('show');
  });
</script>
</body>
</html>
